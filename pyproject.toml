[project]
name = "parivox-agents"
version = "0.1.0"
description = "Build LiveKit agents that run on your own LiveKit project and join Parivox rooms."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Parivox" }]
keywords = ["livekit", "agents", "voice", "parivox", "meetings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Conferencing",
]
dependencies = [
    "livekit-agents>=1.8.8,<2",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
# What examples/room_scribe needs on top of the package.
examples = [
    "livekit-plugins-silero>=1.8.8,<2",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/parivox/parivox-agent"
Issues = "https://github.com/parivox/parivox-agent/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parivox_agents"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
